# Deploys the static Stone Aura site to GitHub Pages on every push to main.
# No build step: the site is plain HTML/CSS/JS; only the public files are published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir -p _site
          cp index.html index-standalone.html _site/
          cp -r assets _site/assets
          touch _site/.nojekyll
          test -f _site/index.html && ls -R _site | head -80
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
